  # Taskbar with Edge
  - !powerShell:
    command: '$taskbar="""$env:APPDATA\Microsoft\Internet Explorer\Quick Launch\User Pinned\TaskBar"""; rm """$taskbar\*""" -Force -EA 0; $wsh=New-Object -ComObject WScript.Shell; $lnk=$wsh.CreateShortcut("""$taskbar\File Explorer.lnk"""); $lnk.TargetPath="""$env:systemroot\explorer.exe"""; $lnk.Save(); $lnk=$wsh.CreateShortcut("""$taskbar\Microsoft Edge.lnk"""); $lnk.TargetPath="""$env:ProgramFiles (x86)\Microsoft\Edge\Application\msedge.exe"""; $lnk.Save()'
    runas: currentUserElevated
    wait: true
    option: browser-edge

  - !registryValue:
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Taskband'
    value: 'FavoritesResolve'
    type: REG_BINARY
    data: ''
    option: browser-edge

  - !registryValue:
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Taskband'
    value: 'Favorites'
    type: REG_BINARY
    data: ''
    option: browser-edge

  # Start Menu
  - !status: {status: 'Configuring Start Menu'}
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:"SearchEngine-Client-Package" /NoRestart'}
  - !service: {name: 'wsearch', operation: change, startup: 4} #disableindexing
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Search', value: 'BingSearchEnabled', type: REG_DWORD, data: '0'} #removebingsearch
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\SearchSettings', value: 'IsAADCloudSearchEnabled', type: REG_DWORD, data: '0'} #turnoffcloudcontentsearchforworkaccount
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\SearchSettings', value: 'IsDeviceSearchHistoryEnabled', type: REG_DWORD, data: '0'} #turnoffdevicesearchhistory
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\SearchSettings', value: 'IsMSACloudSearchEnabled', type: REG_DWORD, data: '0'} #cloudcntentsearchoff
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\SearchSettings', value: 'SafeSearchMode', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search', value: 'ConnectedSearchUseWeb', type: REG_DWORD, data: '0'} #turnoffonlinesearch
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search', value: 'DisableWebSearch', type: REG_DWORD, data: '1'} #disablewebsearch
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Search', value: 'EnableDynamicContentInWSB', type: REG_DWORD, data: '0'} #disablesearchhighlights
  - !registryValue: {path: 'HKCU\SOFTWARE\Policies\Microsoft\Windows\Explorer', value: 'DisableSearchBoxSuggestions', type: REG_DWORD, data: '1'} #Turn off display of recent search entries in the File Explorer search box
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Search', value: 'SearchboxTaskbarMode', type: REG_DWORD, data: '0'} #disablesearchico
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings', value: 'IsDynamicSearchBoxEnabled', type: REG_DWORD, data: '0'} #turn off search highlights
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer', value: 'NoStartMenuMFUprogramsList', type: REG_DWORD, data: '1'} #Remove frequent programs list from the Start Menu
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer', value: 'ShowOrHideMostUsedApps', type: REG_DWORD, data: '2'} #Show or hide "Most used" list from Start menu
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer', value: 'HideRecentlyAddedApps', type: REG_DWORD, data: '1'} #Remove "Recently added" list from Start Menu
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Explorer', value: 'HideRecommendedPersonalizedSites', type: REG_DWORD, data: '1'} #Remove Personalized Website Recommendations from the Recommended section in the Start Menu
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System', value: 'HideFastUserSwitching', type: REG_DWORD, data: '1'} #Hide entry points for Fast User Switching
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'Start_IrisRecommendations', type: REG_DWORD, data: '0'} #Disable Show recommendations for tips shortcuts new apps
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced', value: 'Start_AccountNotifications', type: REG_DWORD, data: '0'} #turn off account related notifications
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer', value: 'NoNetworkConnections', type: REG_DWORD, data: '1'} #Remove Network Connections from Start Menu

  # Clean pins
  - !powerShell: {command: '$p=\"$env:LOCALAPPDATA\Packages\"; Get-ChildItem $p -Directory | Where-Object{$_.Name -match \"Microsoft.Windows.StartMenuExperienceHost\"} | ForEach-Object{ Get-ChildItem \"$p\$($_.Name)\LocalState\" -Filter \"start*.bin\" -ErrorAction SilentlyContinue | Remove-Item -Force }; Get-ChildItem \"HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\CloudStore\Store\Cache\DefaultAccount\" -Recurse -ErrorAction SilentlyContinue | Where-Object{$_.Name -match \"start.tilegrid\"} | Remove-Item -Force; Remove-ItemProperty -Path \"HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Start\" -Name Config -Force -ErrorAction SilentlyContinue', runas: currentUserElevated, wait: true}

  # Notepad
  - !status: {status: 'Restoring old notepad'}
  - !registryKey: {path: 'HKCR\*\OpenWithList\notepad.exe', operation: 'add'}
  - !registryValue: {path: 'HKCR\Applications\notepad.exe', value: 'NoOpenWith', operation: 'delete'}
  - !registryValue: {path: 'HKCR\Applications\notepad.exe\DefaultIcon', value: '', type: REG_EXPAND_SZ, data: '%SystemRoot%\System32\imageres.dll,-102'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Notepad', value: 'ShowStoreBanner', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Notepad', value: 'fWrapAround', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKCR\.txt\ShellNew', value: 'ItemName', type: REG_EXPAND_SZ, data: '@%SystemRoot%\System32\notepad.exe,-470'}
  - !registryValue: {path: 'HKCR\.txt\ShellNew', value: 'NullFile', type: REG_SZ, data: ''}
  - !registryValue: {path: 'HKCR\txtfilelegacy', value: '', type: REG_SZ, data: 'Text Document'}
  - !registryValue: {path: 'HKCR\txtfilelegacy', value: 'EditFlags', type: REG_DWORD, data: '2162688'}
  - !registryValue: {path: 'HKCR\txtfilelegacy', value: 'FriendlyTypeName', type: REG_EXPAND_SZ, data: '@%SystemRoot%\System32\notepad.exe,-469'}
  - !registryValue: {path: 'HKCR\txtfilelegacy\DefaultIcon', value: '', type: REG_EXPAND_SZ, data: '%SystemRoot%\System32\imageres.dll,-102'}
  - !registryValue: {path: 'HKCR\txtfilelegacy\Shell\Open\Command', value: '', type: REG_EXPAND_SZ, data: '%SystemRoot%\System32\notepad.exe %1'}
  - !registryValue: {path: 'HKCR\inifile', value: '', type: REG_SZ, data: 'Configuration Settings'}
  - !registryValue: {path: 'HKCR\inifile', value: 'EditFlags', type: REG_DWORD, data: '2097152'}
  - !registryValue: {path: 'HKCR\inifile', value: 'FriendlyTypeName', type: REG_SZ, data: '@%SystemRoot%\System32\shell32.dll,-10151'}
  - !registryValue: {path: 'HKCR\inifile\DefaultIcon', value: '', type: REG_EXPAND_SZ, data: '%SystemRoot%\System32\imageres.dll,-69'}
  - !registryValue: {path: 'HKCR\inifile\Shell\Edit\Command', value: '', type: REG_EXPAND_SZ, data: '%SystemRoot%\System32\notepad.exe %1'}
  - !registryValue: {path: 'HKCR\inifile\Shell\Open\Command', value: '', type: REG_EXPAND_SZ, data: '%SystemRoot%\System32\notepad.exe %1'}
  - !registryValue: {path: 'HKCR\.ini', value: '', type: REG_SZ, data: 'inifile'}
  - !registryValue: {path: 'HKCR\inffile', value: '', type: REG_SZ, data: 'Setup Information'}
  - !registryValue: {path: 'HKCR\inffile', value: 'FriendlyTypeName', type: REG_EXPAND_SZ, data: '@%SystemRoot%\System32\setupapi.dll,-2000'}
  - !registryValue: {path: 'HKCR\inffile\DefaultIcon', value: '', type: REG_EXPAND_SZ, data: '%SystemRoot%\System32\imageres.dll,-69'}
  - !registryValue: {path: 'HKCR\inffile\Shell\Open\Command', value: '', type: REG_EXPAND_SZ, data: '%SystemRoot%\System32\notepad.exe %1'}
  - !registryValue: {path: 'HKCR\.inf', value: '', type: REG_SZ, data: 'inffile'}
  - !registryValue: {path: 'HKCR\.log', value: '', type: REG_SZ, data: 'txtfilelegacy'}
  - !registryValue: {path: 'HKCR\.scp', value: '', type: REG_SZ, data: 'txtfilelegacy'}
  - !registryValue: {path: 'HKCR\.wtx', value: '', type: REG_SZ, data: 'txtfilelegacy'}
  - !registryValue: {path: 'HKCR\Microsoft.PowerShellScript.1\Shell\Edit\Command', value: '', type: REG_SZ, data: '"C:\Windows\System32\notepad.exe" "%1"'}
