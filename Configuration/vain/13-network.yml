---
# ======================================================================
#  13 - Network
#
#  Network stack reset, NIC reinstall and adapter/TCP settings.
#  Last: it drops the connection, and every download comes before it.
# ======================================================================

actions:
  # Configure Network
  - !status: {status: 'Configuring NIC'}
  - !cmd: {command: 'netsh int ip reset >nul 2>&1 & exit /b 0', runas: currentUserElevated, wait: true}
  - !cmd: {command: 'netsh interface ipv4 reset >nul 2>&1 & exit /b 0', runas: currentUserElevated, wait: true}
  - !cmd: {command: 'netsh interface ipv6 reset >nul 2>&1 & exit /b 0', runas: currentUserElevated, wait: true}
  - !cmd: {command: 'netsh interface tcp reset >nul 2>&1', runas: currentUserElevated, wait: true}
  - !cmd: {command: 'netsh winsock reset >nul 2>&1', runas: currentUserElevated, wait: true}
  - !powerShell: {command: '$net = { @(Get-PnpDevice -Class Net -Status OK -ErrorAction SilentlyContinue | Where-Object { $_.InstanceId -notmatch ''^(ROOT|SWD|BTH)\\'' }) }; $devs = & $net; foreach ($dev in $devs) { pnputil /remove-device $dev.InstanceId 2>&1 | Out-Null }; pnputil /scan-devices 2>&1 | Out-Null; $i = 0; while ($i -lt 120 -and (& $net).Count -lt $devs.Count) { Start-Sleep -Milliseconds 500; $i++ }', runas: currentUserElevated, wait: true}


  - !powerShell: {command: 'Get-ChildItem ''HKLM:\SYSTEM\CurrentControlSet\Control\Class\{4d36e972-e325-11ce-bfc1-08002be10318}'' -ErrorAction SilentlyContinue | ForEach-Object { if (Get-ItemProperty -Path $_.PSPath -Name "EnablePME" -ErrorAction SilentlyContinue) { Set-ItemProperty -Path $_.PSPath -Name "EnablePME" -Value "0" -Type String -Force -ErrorAction SilentlyContinue } }', runas: currentUserElevated, wait: true} #0 disabled
