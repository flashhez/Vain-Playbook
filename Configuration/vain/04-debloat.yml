---
# ======================================================================
#  04 - Debloat
#
#  Windows optional features, OneDrive and Microsoft Edge removal,
#  AppX package removal.
# ======================================================================

actions:
  # Features
  - !status: {status: 'Enabling DirectPlay'}
  - !run: {exe: 'DISM.exe', args: '/Online /Enable-Feature /FeatureName:"DirectPlay" /NoRestart /All'}

  - !status: {status: 'Disabling StepsRecorder'}
  - !run: {exe: 'DISM.exe', args: '/Online /Remove-Capability /CapabilityName:"App.StepsRecorder~~~~0.0.1.0" /NoRestart'}

  - !status: {status: 'Disabling Legacy Media Player'}
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:"WindowsMediaPlayer" /NoRestart'}
  - !run: {exe: 'DISM.exe', args: '/Online /Remove-Capability /CapabilityName:"Media.WindowsMediaPlayer~~~~0.0.12.0" /NoRestart'}
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:"MediaPlayback" /NoRestart'}

  - !status: {status: 'Disabling SMBDirect'}
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:"SMBDirect" /NoRestart'}

  - !status: {status: 'Disabling RDC'}
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:"MSRDC-Infrastructure" /NoRestart'}

  - !status: {status: 'Disabling Workfolders Client'}
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:"Workfolders-client" /NoRestart'}

  - !status: {status: 'Disabling WCF services & portsharing'}
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:"WCF-Services45" /NoRestart'}
  - !run: {exe: 'DISM.exe', args: '/Online /Disable-Feature /FeatureName:"WCF-TCP-PortSharing45" /NoRestart'}

  # Onedrive
  - !status: {status: 'Removing OneDrive'}
  - !cmd: {command: 'OneDriveSetup /uninstall', runas: currentUserElevated, wait: true}
  - !file: {path: '%ProgramData%\Microsoft OneDrive'}
  - !file: {path: '%UserProfile%\OneDrive'}
  - !file: {path: '%LocalAppdata%\Microsoft\OneDrive'}
  - !file: {path: '%SystemRoot%\System32\OneDriveSetup.exe'}
  - !file: {path: '%SystemRoot%\SysWOW64\OneDriveSetup.exe'}
  - !registryKey: {path: 'HKCU\Software\Microsoft\OneDrive'}
  - !registryKey: {path: 'HKCU\Software\WOW6432Node\Microsoft\OneDrive'}
  - !registryKey: {path: 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\BannerStore'}
  - !registryKey: {path: 'HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Explorer\BannerStore'}
  - !registryValue: {path: 'HKCU\Environment', value: 'OneDrive', operation: 'delete'}
  - !powerShell: {command: "Get-ScheduledTask | Where-Object { $_.TaskName -like '*Oned*' } | ForEach-Object { Unregister-ScheduledTask -TaskName $_.TaskName -Confirm:$false }", runas: currentUserElevated, wait: true}

  # Microsoft Edge
  - !status: {status: 'Removing Microsoft Edge', option: '!browser-edge'}
  - !service: {name: 'edgeupdate', operation: delete, option: '!browser-edge'}
  - !service: {name: 'edgeupdatem', operation: delete, option: '!browser-edge'}
  - !service: {name: 'MicrosoftEdgeElevationService', operation: delete, option: '!browser-edge'}
  - !file: {path: '%ProgramFiles(x86)%\Microsoft\EdgeUpdate', option: '!browser-edge'}
