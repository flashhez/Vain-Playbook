<?xml version="1.0" encoding="utf-8"?>
<Playbook>
	<Name>Vain</Name>
	<Username>VAIN</Username>
	<Title>Vain Playbook</Title>
	<ShortDescription>Windows 11 set up for games, with Vain Tools.</ShortDescription>
	<Description>Sets up a fresh Windows 11 install for games: less running in the background, a tuned power plan, scheduler and timers, telemetry and bloat removed, and Vain Tools installed and ready.</Description>
	<Details>For a fresh install only. It turns off UAC, VBS and the CPU mitigations (each can be turned back on in Vain Toolbox) and removes Windows Defender, which can't be undone. Back up first and follow the guide at vain.zone/guide-playbook.html.</Details>
	<ProgressText>UNLEASH PERFORMANCE. vain.zone | The playbook is free. Only our live sessions are paid, booked on vain.zone.</ProgressText>
	<Version>2.0.0</Version>
	<SupportedBuilds>
		<string>22631</string>
		<string>26100</string>
		<string>26200</string>
		<string>26300</string>
		<string>28000</string>
	</SupportedBuilds>
	<Requirements>
		<Requirement>DefenderToggled</Requirement>
		<Requirement>DefenderDisabled</Requirement>
		<Requirement>NoAntivirus</Requirement>
		<Requirement>NoPendingUpdates</Requirement>
		<Requirement>PluggedIn</Requirement>
		<Requirement>FreshInstall</Requirement>
		<Requirement>Internet</Requirement>
	</Requirements>
	<Overhaul>true</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<EstimatedMinutes>5</EstimatedMinutes>
	<Website>https://vain.zone</Website>
	<DonateLink>https://vain.zone</DonateLink>
	<FeaturePages>
		<CheckboxPage IsRequired="true">
			<TopLine Text="Start Menu Configuration"/>
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Remove Windows Start Menu &amp; Search</Text>
					<Name>removestartmenu</Name>
				</CheckboxOption>
			</Options>
			<BottomLine Text="Touchscreen require startmenu"/>
		</CheckboxPage>
		<CheckboxPage IsRequired="true">
			<Options>
				<CheckboxOption>
					<Text>Install a Browser</Text>
					<Name>install-browser</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<RadioImagePage DependsOn="install-browser" DefaultOption="browser-helium">
			<TopLine Text="Select a browser Page 1/2 (Recommended)"/>
			<Options>
				<RadioImageOption>
					<Text>Helium</Text>
					<Name>browser-helium</Name>
					<FileName>helium</FileName>
					<GradientTopColor>#4A90D9</GradientTopColor>
					<GradientBottomColor>#1A1A2E</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>LibreWolf</Text>
					<Name>browser-librewolf</Name>
					<FileName>librewolf</FileName>
					<GradientTopColor>#1ae3dc</GradientTopColor>
					<GradientBottomColor>#5743ff</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Brave</Text>
					<Name>browser-brave</Name>
					<FileName>brave</FileName>
					<GradientTopColor>#FFFFFE</GradientTopColor>
					<GradientBottomColor>#880808</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Next Page →</Text>
					<Name>browser-page1-next</Name>
					<FileName>next</FileName>
					<GradientTopColor>#4A4A4A</GradientTopColor>
					<GradientBottomColor>#2C2C2C</GradientBottomColor>
				</RadioImageOption>
			</Options>
			<BottomLine Text="Browsers require AVX2"/>
		</RadioImagePage>
		<RadioImagePage DependsOn="browser-page1-next" DefaultOption="browser-firefoxdev">
			<TopLine Text="Select a browser Page 2/2"/>
			<Options>
				<RadioImageOption>
					<Text>Firefox Developer</Text>
					<Name>browser-firefoxdev</Name>
					<FileName>firefoxdev</FileName>
					<GradientTopColor>#057DB6</GradientTopColor>
					<GradientBottomColor>#86D8FF</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Firefox</Text>
					<Name>browser-firefox</Name>
					<FileName>firefox</FileName>
					<GradientTopColor>#FF3647</GradientTopColor>
					<GradientBottomColor>#FFC742</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Chrome</Text>
					<Name>browser-chrome</Name>
					<FileName>chrome</FileName>
					<GradientTopColor>#4285F4</GradientTopColor>
					<GradientBottomColor>#34A853</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Edge</Text>
					<Name>browser-edge</Name>
					<FileName>edge</FileName>
					<GradientTopColor>#47d18c</GradientTopColor>
					<GradientBottomColor>#0f529a</GradientBottomColor>
				</RadioImageOption>
			</Options>
		</RadioImagePage>
	</FeaturePages>
</Playbook>