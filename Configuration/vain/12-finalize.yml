---
# ======================================================================
#  12 - Finalize
#
#  File associations, performance counters, Vain Tools install and
#  Governor configuration, cleanup.
# ======================================================================

actions:
  # Configure File Associations
  - !status: {status: 'Setting file associations'}
  - !powerShell: {command: '.\SetFileTypeAssociation.ps1', exeDir: true, wait: true, runas: currentuser}

  # Rebuild Perf Counters
  - !status: {status: 'Rebuilding Perf Counters'}
  - !run: {exe: 'lodctr', args: '/r'}
  - !run: {exe: 'lodctr', args: '/r'}
  - !run: {exe: 'winmgmt', args: '/resyncperf'}

  # Disable printscreen
  - !registryValue: {path: 'HKCU\Control Panel\Keyboard', value: 'PrintScreenKeyForSnippingEnabled', type: REG_DWORD, data: '0'}

  # Vain Tools
  - !status: {status: 'Installing Vain Tools'}
  - !download: {url: 'https://raw.githubusercontent.com/flashhez/VainTools/main/VainUpdater.exe', destination: '%temp%\VainUpdater.exe', overwrite: true}
  - !cmd: {command: '"%temp%\VainUpdater.exe" /silent', runas: currentUserElevated, wait: true}

  # Configure Vain Tools
  - !status: {status: 'Configuring Vain Tools'}
