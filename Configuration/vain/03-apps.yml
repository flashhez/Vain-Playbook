  # Browsers
  - !status: {status: 'Installing Firefox Dev', option: 'browser-firefoxdev'}
  - !download: {option: 'browser-firefoxdev', url: 'https://download.mozilla.org/?product=firefox-devedition-latest-ssl&os=win64&lang=en-US', destination: '%temp%\FirefoxDev.exe', overwrite: true}
  - !cmd: {option: 'browser-firefoxdev', command: '"%temp%\FirefoxDev.exe" /S', runas: currentUserElevated}

  - !status: {status: 'Installing Firefox', option: 'browser-firefox'}
  - !download: {option: 'browser-firefox', url: 'https://download.mozilla.org/?product=firefox-latest&os=win64&lang=en-US', destination: '%temp%\Firefox.exe', overwrite: true}
  - !cmd: {option: 'browser-firefox', command: '"%temp%\Firefox.exe" /S', runas: currentUserElevated}

  - !status: {status: 'Installing Chrome', option: 'browser-chrome'}
  - !download: {option: 'browser-chrome', url: 'https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi', destination: '%temp%\Chrome.msi', overwrite: true}
  - !cmd: {option: 'browser-chrome', command: '"%temp%\Chrome.msi" /quiet /norestart', runas: currentUserElevated}

  - !status: {status: 'Installing Brave', option: 'browser-brave'}
  - !download: {option: 'browser-brave', url: 'https://laptop-updates.brave.com/latest/winx64', destination: '%temp%\Brave.exe', overwrite: true}
  - !cmd: {option: 'browser-brave', command: '"%temp%\Brave.exe" /silent /install', runas: currentUserElevated}

  - !status: {status: 'Installing Librewolf', option: 'browser-librewolf'}
  - !powerShell: {command: '$librewolfVersion=(Invoke-RestMethod "https://gitlab.com/api/v4/projects/44042130/releases")[0].Name; if([string]::IsNullOrEmpty($librewolfVersion)) { throw "GitLab API returned nothing!" }; curl.exe -LSs "https://gitlab.com/api/v4/projects/44042130/packages/generic/librewolf/$librewolfVersion/librewolf-$librewolfVersion-windows-x86_64-setup.exe" -o "$env:TEMP\librewolf-setup.exe"', runas: currentUserElevated, option: 'browser-librewolf', wait: true}
  - !powerShell: {command: 'Start-Process -Wait -FilePath "$env:TEMP\librewolf-setup.exe" -ArgumentList "/S"; if (!(Test-Path \"C:\Program Files\LibreWolf\librewolf.exe\")) { throw "Installing LibreWolf silently failed." }', option: 'browser-librewolf', runas: currentUserElevated, wait: true}

  - !status: {status: 'Installing Helium', option: 'browser-helium'}
  - !download: {option: 'browser-helium', git: 'https://github.com/imputnet/helium-windows', regex: '^helium_.*_x64-mini-installer\.exe$', destination: '%temp%\Helium.exe', overwrite: true}
  - !cmd: {option: 'browser-helium', command: '"%temp%\Helium.exe" --silent --system-level --do-not-launch-chrome', runas: currentUserElevated}


  # Taskbar without Browser
  - !status: {status: 'Configuring taskbar'}
  - !powerShell:
    command: '$taskbar="""$env:APPDATA\Microsoft\Internet Explorer\Quick Launch\User Pinned\TaskBar"""; rm """$taskbar\*""" -Force -EA 0; $wsh=New-Object -ComObject WScript.Shell; $lnk=$wsh.CreateShortcut("""$taskbar\File Explorer.lnk"""); $lnk.TargetPath="""$env:systemroot\explorer.exe"""; $lnk.Save()'
    runas: currentUserElevated
    wait: true
    option: '!install-browser'

  - !registryValue:
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Taskband'
    value: 'FavoritesResolve'
    type: REG_BINARY
    data: ''
    option: '!install-browser'

  - !registryValue:
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Taskband'
    value: 'Favorites'
    type: REG_BINARY
    data: ''
    option: '!install-browser'

